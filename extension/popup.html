<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FunTouch Control Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090D16;
      color: #F8FAFC;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1E293B;
    }
    .logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(90deg, #FF7A00, #FFB800, #00C2FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-card {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-label {
      font-size: 12px;
      color: #94A3B8;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-active {
      background: rgba(255, 122, 0, 0.15);
      color: #FF7A00;
      border: 1px solid rgba(255, 122, 0, 0.3);
    }
    .badge-idle {
      background: #1E293B;
      color: #64748B;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .tab-info {
      font-size: 11px;
      color: #64748B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(90deg, #FF7A00, #FF9500);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(255, 122, 0, 0.25);
    }
    .btn-primary:hover {
      background: linear-gradient(90deg, #E66E00, #E68500);
    }
    .btn-danger {
      background: #DC2626;
      color: #FFFFFF;
    }
    .btn-danger:hover {
      background: #B91C1C;
    }
    .instructions {
      margin-top: 14px;
      font-size: 11px;
      color: #64748B;
      line-height: 1.4;
      background: #0B1120;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-48.png" alt="FunTouch" class="logo">
    <span class="title">FunTouch Extension</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Remote Control</span>
      <span id="status-badge" class="badge badge-idle">
        <span class="dot"></span>
        <span id="status-text">Standby</span>
      </span>
    </div>
    <div id="tab-title" class="tab-info">No tab currently linked</div>
  </div>

  <div class="actions">
    <button id="set-target-btn" class="btn-primary">
      <span>🎯 Set Current Tab as Controlled Tab</span>
    </button>
    <button id="stop-control-btn" class="btn-danger" style="display: none;">
      <span>🛑 Stop Remote Control (Esc)</span>
    </button>
  </div>

  <div class="instructions">
    💡 <strong>How it works:</strong><br>
    1. Navigate to the tab you want to share (e.g. YouTube).<br>
    2. Click <em>"Set Current Tab as Controlled Tab"</em>.<br>
    3. In FunTouch, click <strong>Allow Control</strong>.
  </div>

  <script src="popup.js"></script>
</body>
</html>
